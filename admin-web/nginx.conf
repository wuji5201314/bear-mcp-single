map $http_x_forwarded_proto $mcpforge_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # 使用 Docker 内置 DNS，后端容器重建后可以重新解析其 IP。
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $mcpforge_backend mcpforge:8090;

    location /api/ {
        proxy_pass http://$mcpforge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mcpforge_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # MCP Streamable HTTP 可能持续返回事件流，必须关闭代理缓冲。
    location /mcp {
        proxy_pass http://$mcpforge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mcpforge_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
