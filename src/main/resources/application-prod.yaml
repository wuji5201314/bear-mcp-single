server:
  port: ${SERVER_PORT:8090}

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MCPFORGE_MYSQL_URL}
    username: ${MCPFORGE_MYSQL_USERNAME}
    password: ${MCPFORGE_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: mcpforge-prod
      minimum-idle: ${MCPFORGE_DB_MIN_IDLE:5}
      maximum-pool-size: ${MCPFORGE_DB_MAX_POOL_SIZE:20}
      connection-timeout: ${MCPFORGE_DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${MCPFORGE_DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${MCPFORGE_DB_MAX_LIFETIME:1800000}
  sql:
    init:
      mode: never

mcpforge:
  admin:
    jwt-secret: ${MCPFORGE_ADMIN_JWT_SECRET}
    jwt-expire-seconds: ${MCPFORGE_ADMIN_JWT_EXPIRE_SECONDS:7200}
  mcp:
    demo-token: ${MCPFORGE_MCP_DEMO_TOKEN}
  storage:
    tos:
      endpoint: ${MCPFORGE_TOS_ENDPOINT}
      public-endpoint: ${MCPFORGE_TOS_PUBLIC_ENDPOINT:}
      region: ${MCPFORGE_TOS_REGION}
      bucket: ${MCPFORGE_TOS_BUCKET}
      access-key: ${MCPFORGE_TOS_ACCESS_KEY}
      secret-key: ${MCPFORGE_TOS_SECRET_KEY}
      upload-expire-seconds: ${MCPFORGE_TOS_UPLOAD_EXPIRE_SECONDS:600}
  repository-command:
    root: ${MCPFORGE_REPOSITORY_ROOT:/data/repositories}
    repositories:
      xxx-admin: ${MCPFORGE_XXX_ADMIN_REPOSITORY_DIRECTORY:xxx-admin}
    timeout-seconds: ${MCPFORGE_REPOSITORY_COMMAND_TIMEOUT_SECONDS:5}
    max-output-lines: ${MCPFORGE_REPOSITORY_COMMAND_MAX_OUTPUT_LINES:300}
    max-output-bytes: ${MCPFORGE_REPOSITORY_COMMAND_MAX_OUTPUT_BYTES:20000}

xxx:
  admin:
    base-url: ${XXX_ADMIN_BASE_URL:http://xxx-admin:8080}
    shared-secret: ${MCPFORGE_XXX_SHARED_SECRET}

feishu:
  app-id: ${FEISHU_APP_ID}
  app-secret: ${FEISHU_APP_SECRET}
  token:
    tenant-url: ${FEISHU_TENANT_TOKEN_URL:https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal}
  mcp:
    url: ${FEISHU_MCP_URL:https://mcp.feishu.cn/mcp}
    credential-type: ${FEISHU_MCP_CREDENTIAL_TYPE:TAT}

logging:
  level:
    root: INFO
    com.mcpforge: INFO
    com.mcpforge.core.mapper: WARN
    org.mybatis: WARN
    org.springframework.ai.mcp: INFO
