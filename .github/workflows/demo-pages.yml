name: Demo (GitHub Pages)

# Publishes the admin console as a static, backend-free demo build.
# Requires Pages to be enabled for the repository (Settings → Pages → Source: GitHub Actions).

on:
  push:
    branches: [main]
    paths:
      - 'admin-web/**'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo bundle
    # GitHub Pages is unavailable for private repositories on the free plan, so
    # this job stays idle until the repository sets the ENABLE_PAGES variable.
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build demo
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:demo
      - name: SPA fallback
        run: cp dist-demo/index.html dist-demo/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin-web/dist-demo

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
