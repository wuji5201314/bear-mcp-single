services:
  mcpforge:
    image: ${MCPFORGE_IMAGE:-mcpforge:latest}
    container_name: mcpforge
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8090
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m}
    volumes:
      - /data/repositories:/data/repositories:ro
    networks:
      - xxx-network

networks:
  xxx-network:
    external: true
